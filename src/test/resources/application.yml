spring:
  datasource:
    url: jdbc:h2:mem:file_loader_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true

file-loader:
  input-directory: ./target/test-input
  archive-directory: ./target/test-input/archive
  batch-size: 500
