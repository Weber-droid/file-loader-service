services:
  postgres:
    image: postgres:15-alpine
    container_name: file-loader-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ussd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fileloader
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./scripts/seed-test-data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ussd"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
